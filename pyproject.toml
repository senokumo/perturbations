[project]
name = "perturb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audioflux>=0.1.9",
    "cython>=3.2.1",
    "essentia>=2.1b6.dev1389",
    "internetarchive>=5.5.1",
    "ipykernel>=6.30.1",
    "librosa>=0.11.0",
    "matplotlib>=3.10.6",
    "mido>=1.3.3",
    "mypy>=1.18.2",
    "nbstripout>=0.8.2",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/perturbations"]
